plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

// Loader-qualified release name: <mod_id>-<minecraft>-neoforge-<mod_version>.jar
base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The named server proof lives separately and never reaches the release jar.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

def proof = project.findProperty('proof')
def terralithJar = project.findProperty('terralithJar')

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.gameTest)
    addModdingDependenciesTo(sourceSets.test)

    runs {
        server {
            server()
            gameDirectory = project.file(proof ? "run/${proof}" : 'run')
            programArgument '--nogui'
            if (proof) {
                systemProperty "${mod_id}.proof", proof.toString()
                systemProperty "${mod_id}.matrix", (terralithJar != null).toString()
                systemProperty 'http.proxyHost', '127.0.0.1'
                systemProperty 'http.proxyPort', '9'
                systemProperty 'https.proxyHost', '127.0.0.1'
                systemProperty 'https.proxyPort', '9'
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version, neo_version_range: neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version            : mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replacements
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replacements + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
    // Mixins are declared in neoforge.mods.toml ([[mixins]]), not the manifest.
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Named, bounded dedicated-server proof. The local Terralith jar is never part of the release artifact.
if (proof) {
    tasks.register('prepareProof') {
        doLast {
            if (!(proof.toString() ==~ /[a-z][a-z0-9-]*/)) throw new GradleException('Invalid proof name')
            def dir = file("run/${proof}")
            dir.mkdirs()
            if (terralithJar != null) {
                def terralith = file(terralithJar)
                if (!terralith.isFile()) throw new GradleException("Missing local Terralith jar: ${terralith}")
                copy { from terralith; into new File(dir, 'mods') }
            }
            new File(dir, 'eula.txt').text = 'eula=true\n'
            def type = project.findProperty('worldType') ?: 'flat'
            new File(dir, 'server.properties').text = """level-name=world
level-type=${type}
level-seed=0
online-mode=false
server-ip=127.0.0.1
server-port=0
enable-query=false
enable-rcon=false
generate-structures=false
spawn-animals=false
spawn-monsters=false
spawn-npcs=false
view-distance=2
simulation-distance=2
sync-chunk-writes=false
max-tick-time=120000
generator-settings={"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"lakes":false,"features":false,"structure_overrides":[]}
"""
        }
    }
    tasks.named('runServer').configure { dependsOn 'prepareProof' }
}

apply from: 'gradle/verify-release-jar.gradle'
